services:
  app:
    command:
      - uvicorn
      - environment.api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    volumes:
      - ./agents:/app/agents
      - ./security:/app/security
      - ./environment/__init__.py:/app/environment/__init__.py
      - ./environment/api.py:/app/environment/api.py
      - ./environment/database.py:/app/environment/database.py
      - ./environment/audit_log.py:/app/environment/audit_log.py
      - ./environment/tool_schemas.py:/app/environment/tool_schemas.py
      - ./environment/tools.py:/app/environment/tools.py
      - ./environment/templates:/app/environment/templates
      - ./environment/static:/app/environment/static
